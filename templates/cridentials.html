<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f4f9;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="container">

        <h2>Registered Members</h2>

        <table>
            <tr>
                <th>Email</th>
                <th>Password</th>
            </tr>
            {% for user in cridentials %}

            <tr>
                <td>{{ user[0]}}</td>
                <td>Hidden for security</td>
            </tr>

            {% endfor %}
        </table>


    </div>

    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Fee</title>


    <style>
        
body {
    font-family: Arial, sans-serif;
    background-color: #a4b9b2;
    margin: 0;
    padding: 30px;
}

.table-container {
    background: rgb(253, 253, 253);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    max-width: 1200px;
    margin: 30px auto;
    overflow-x: auto;
}

h2 {
    color: #14532d;
    margin-bottom: 5px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

thead {
    background-color: #14532d;
    color: white;
}

th, td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    font-size: 14px;
    white-space: nowrap;
}

td {
    font-size: 14px;
    color: #444;
}

tbody tr:hover {
    background-color: #f0fdf4;
}

.student-name {
    font-weight: bold;
    color: #14532d;
}

.paid {
    color: #15803d;
    font-weight: bold;
}

.balance {
    color: #dc2626;
    font-weight: bold;
}

tbody tr:last-child td {
    border-bottom: none;
}

/* Search form */
form {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

/* Search input */
input[type="text"] {
    width: 300px;
    padding: 12px 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

/* Input when clicked */
input[type="text"]:focus {
    border-color: #14532d;
    box-shadow: 0 0 5px rgba(20, 83, 45, 0.3);
}

/* Search button */
form button {
    background-color: #14532d;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

/* Button hover */
form button:hover {
    background-color: #166534;
}

    </style>
</head>
<body>



    <h2>Students Fees Records</h2>

    <form method="POST" action="{{url_for('search_student')}}">
        <input type="text" name="search" placeholder="Enter student's name..." >
        <button type="submit">Search</button>
    </form>

    <table>
        <tr>
            <th>id</th>
            <th>Student Name</th>
            <th>Admission Number</th>
            <th>Total fees (Ksh.)</th>
            <th>Amount Paid (Ksh.)</th>
            <th>Balance (Ksh.)</th>
        </tr>
        {% for student in students_fee %}

        <tr>
            <td>{{student[0]}}</td>
            <td>{{student[1]}}</td>
            <td>{{student[2]}}</td>
            <td>{{student[3]}}</td>
            <td>{{student[4]}}</td>
            <td>{{student[5]}}</td>
            

        </tr>
        {% endfor %}
    </table>

    
</body>
</html>

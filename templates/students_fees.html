<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Fee</title>


    <style>
        
body {
    font-family: Arial, sans-serif;
    background-color: #a4b9b2;
    margin: 0;
    padding: 30px;
}

.table-container {
    background: rgb(253, 253, 253);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    max-width: 1200px;
    margin: 30px auto;
    overflow-x: auto;
}

h2 {
    color: #14532d;
    margin-bottom: 5px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

thead {
    background-color: #14532d;
    color: white;
}

th, td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    font-size: 14px;
    white-space: nowrap;
}

td {
    font-size: 14px;
    color: #444;
}

tbody tr:hover {
    background-color: #f0fdf4;
}

.student-name {
    font-weight: bold;
    color: #14532d;
}

.paid {
    color: #15803d;
    font-weight: bold;
}

.balance {
    color: #dc2626;
    font-weight: bold;
}

tbody tr:last-child td {
    border-bottom: none;
}

    </style>
</head>
<body>
    <h2>Students Fees Records</h2>

    <table>
        <tr>
            <td>id</td>
            <td>Student Name</td>
            <td>Admission Number</td>
            <td>Total fees (Ksh.)</td>
            <td>Amount Paid (Ksh.)</td>
            <td>Balance (Ksh.)</td>
        </tr>
        {% for student in students_fee %}

        <tr>
            <td>{{student[0]}}</td>
            <td>{{student[1]}}</td>
            <td>{{student[2]}}</td>
            <td>{{student[3]}}</td>
            <td>{{student[4]}}</td>
            <td>{{student[5]}}</td>
            

        </tr>
        {% endfor %}
    </table>

    
</body>
</html>
